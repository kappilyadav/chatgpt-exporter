<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChatGPT Exporter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img class="logo" src="../icons/icon48.png" width="38" height="38" alt="" />
    <div>
      <h1>ChatGPT Exporter</h1>
      <p id="site" class="muted">Checking tab…</p>
    </div>
  </header>

  <section id="plan" class="plan" hidden>
    <p id="plan-text" class="small"></p>
    <button id="plan-cta" class="btn primary small-btn"></button>
  </section>

  <main id="active" hidden>
    <button id="select" class="btn primary">Select messages…</button>

    <div class="row">
      <select id="format" aria-label="Format"></select>
      <button id="quick" class="btn">Quick export</button>
    </div>
    <div class="row">
      <button id="copy" class="btn ghost">Copy as Markdown</button>
      <button id="bulk" class="btn ghost">Export all chats…</button>
    </div>
    <p id="msg" class="muted small" role="status"></p>
  </main>

  <main id="inactive" hidden>
    <p>Open a ChatGPT conversation, then click the extension again:</p>
    <div class="links">
      <a href="https://chatgpt.com/" target="_blank" rel="noreferrer">ChatGPT</a>
    </div>
  </main>

  <footer>
    <button id="settings" class="link">Settings</button>
    <button id="shortcuts" class="link">Keyboard shortcuts</button>
  </footer>

  <script src="../src/core/ns.js"></script>
  <script src="../src/core/account.js"></script>
  <script src="popup.js"></script>
</body>
</html>
